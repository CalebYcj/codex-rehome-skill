name: Codex ReHome Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Skill packaging and Windows restore
        shell: pwsh
        run: |
          ./tests/redskill_package_test.ps1
          ./tests/windows_restore_ui_ready_test.ps1
          ./tests/readme_language_test.ps1

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shell syntax and Mac packaging
        shell: bash
        run: |
          bash -n scripts/*.sh
          bash tests/mac_packager_metadata_test.sh
